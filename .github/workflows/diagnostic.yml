name: VISCERA Actions diagnostic
on:
  push:
    paths:
      - ".github/workflows/diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository
        shell: bash
        run: |
          test -f .github/workflows/android-apk.yml
          echo "Flutter sources: $(test -f lib/main.dart && echo present || echo missing)"
          echo "V14 archive: $(test -f VISCERA_V14_sources_pour_GitHub.zip && echo present || echo missing)"
      - name: Check Android workflow syntax
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" .github/workflows/android-apk.yml
