name: VISCERA - Daily discharge review push
# Authentification serveur par jeton OIDC GitHub signé, éphémère et
# limité au dépôt VISCERA, workflow officiel et branche main.
# Aucun secret Supabase n'est conservé dans le workflow ni dans l'APK.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/viscera-daily-discharge-push.yml'
      - 'supabase/functions/viscera-discharge-review/index.ts'
      - 'supabase/functions/viscera-push-dispatch/index.ts'
  schedule:
    # Les notifications entrantes sont distribuées toutes les 5 minutes.
    # Le décalage de 2 minutes évite les pics du début d'heure GitHub.
    - cron: '2-57/5 * * * *'
    # La vérification quotidienne des sorties reste indépendante et limitée.
    - cron: '0 7,9 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  discharge_review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Obtenir le jeton GitHub OIDC à durée de vie courte
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=viscera:notifications:qkupckqgczdqiwxozxko")
          token=$(jq -er '.value' <<< "$response")
          if [ -z "$token" ]; then
            echo "::error::Impossible d'obtenir l'identité OIDC GitHub."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'VISCERA_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Identifier les dossiers à réévaluer sans informations de patient
        if: github.event_name != 'schedule' || github.event.schedule == '0 7,9 * * *'
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --request POST \
            --header "Authorization: Bearer ${VISCERA_OIDC_TOKEN}" \
            --header 'Content-Type: application/json' --data '{}' \
            https://qkupckqgczdqiwxozxko.supabase.co/functions/v1/viscera-discharge-review

      - name: Distribuer les messages FCM anonymisés
        shell: bash
        run: |
          # Ne jamais relancer automatiquement un POST qui peut déjà avoir
          # expédié des messages sur un des appareils.
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${VISCERA_OIDC_TOKEN}" \
            --header 'Content-Type: application/json' --data '{}' \
            https://qkupckqgczdqiwxozxko.supabase.co/functions/v1/viscera-push-dispatch
