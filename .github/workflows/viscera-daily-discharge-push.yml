name: VISCERA - Daily discharge review push
# Authentification serveur par jeton OIDC GitHub signé, éphémère et
# limité au dépôt VISCERA, workflow officiel et branche main.
# Aucun secret Supabase n'est conservé dans le workflow ni dans l'APK.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/viscera-daily-discharge-push.yml'
  schedule:
    # Deux fenêtres : le décalage horaire de Casablanca varie avec la saison.
    # La file garantit au maximum un rappel par compte et par jour.
    - cron: '0 7,9 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  discharge_review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Obtenir le jeton GitHub OIDC à durée de vie courte
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=viscera:notifications:qkupckqgczdqiwxozxko")
          token=$(jq -er '.value' <<< "$response")
          if [ -z "$token" ]; then
            echo "::error::Impossible d'obtenir l'identité OIDC GitHub."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'VISCERA_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Identifier les dossiers à réévaluer sans informations de patient
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --request POST \
            --header "Authorization: Bearer ${VISCERA_OIDC_TOKEN}" \
            --header 'Content-Type: application/json' --data '{}' \
            https://qkupckqgczdqiwxozxko.supabase.co/functions/v1/viscera-discharge-review

      - name: Distribuer les messages FCM anonymisés
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --request POST \
            --header "Authorization: Bearer ${VISCERA_OIDC_TOKEN}" \
            --header 'Content-Type: application/json' --data '{}' \
            https://qkupckqgczdqiwxozxko.supabase.co/functions/v1/viscera-push-dispatch
