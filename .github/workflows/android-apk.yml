name: VISCERA Android APK (debug)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  build_android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérifier les sources
        shell: bash
        run: |
          for file in pubspec.yaml lib/main.dart lib/store.dart lib/screens/auth_gate.dart lib/screens/shell.dart lib/screens/planning.dart lib/screens/personal_planning.dart tool/setup_deep_links.py; do
            test -f "$file" || { echo "::error::Fichier Flutter absent: $file"; exit 1; }
          done
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android,web --project-name viscera --org com.viscera .
      - name: Préparer les outils de branding
        run: python3 -m pip install --disable-pip-version-check cairosvg
      - name: Générer les icônes Android et Web VISCERA
        run: python3 tool/apply_viscera_branding.py
      - name: Configurer Firebase Android
        run: python3 tool/configure_firebase_android.py
      - name: Configurer les liens de confirmation
        run: python3 tool/setup_deep_links.py
      - name: Configurer les rappels Android des gardes
        run: python3 tool/configure_duty_reminders_android.py
      - name: Dépendances
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Construire APK Android debug
        run: flutter build apk --debug --dart-define="SUPABASE_URL=https://qkupckqgczdqiwxozxko.supabase.co" --dart-define="SUPABASE_PUBLISHABLE_KEY=sb_publishable_0G2xPDJrxhbl5sjtIYIZBw_6tK30bO8"
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: VISCERA-Android-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Construire le site Flutter Web
        run: flutter build web --release --dart-define="SUPABASE_URL=https://qkupckqgczdqiwxozxko.supabase.co" --dart-define="SUPABASE_PUBLISHABLE_KEY=sb_publishable_0G2xPDJrxhbl5sjtIYIZBw_6tK30bO8"
      - name: Publier Web
        uses: actions/upload-artifact@v4
        with:
          name: VISCERA-Web-build
          path: build/web
          if-no-files-found: error
          retention-days: 14
