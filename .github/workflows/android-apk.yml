name: VISCERA Android APK (debug)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "VISCERA_V14_sources_pour_GitHub.zip"
permissions:
  contents: read
jobs:
  build_android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Importer automatiquement l'archive V14 (si présente)
        shell: bash
        run: |
          if [ -f VISCERA_V14_sources_pour_GitHub.zip ]; then
            unzip -t VISCERA_V14_sources_pour_GitHub.zip
            unzip -o -q VISCERA_V14_sources_pour_GitHub.zip -d .
            echo "Sources V14 extraites pour compilation"
          fi
      - name: Vérifier que le code Flutter est importé
        shell: bash
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart || { echo "::error::Les sources Flutter V14 doivent être ajoutées à ce dépôt avant la compilation."; exit 1; }
          test -f tool/setup_deep_links.py
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --project-name viscera --org com.viscera .
      - name: Configurer Android pour Firebase Cloud Messaging
        shell: bash
        run: |
          python3 - <<'PY'
