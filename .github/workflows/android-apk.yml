              marker = 'id("dev.flutter.flutter-gradle-plugin")'
              if marker not in app_text:
                  raise SystemExit("Plugin Flutter Gradle introuvable")
              app_text = app_text.replace(
                  marker, marker + '\n    id("com.google.gms.google-services")', 1
              )
          app.write_text(app_text)

          settings_text = settings.read_text()
          if 'id("com.google.gms.google-services")' not in settings_text:
              settings_text, count = re.subn(
                  r'(?m)^plugins \{\s*      - name: Lier les URL de confirmation
        run: python3 tool/setup_deep_links.py
      - name: Installer les dépendances
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: APK Android debug
        env:
          SUPABASE_URL: https://qkupckqgczdqiwxozxko.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_0G2xPDJrxhbl5sjtIYIZBw_6tK30bO8
        run: |
          flutter build apk --debug --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: VISCERA-Android-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
