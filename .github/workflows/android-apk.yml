name: VISCERA Android APK (same UI as Web)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - 'assets/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build_android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérifier les sources
        shell: bash
        run: |
          for file in pubspec.yaml lib/main.dart lib/store.dart lib/screens/auth_gate.dart lib/screens/shell.dart lib/screens/planning.dart lib/screens/personal_planning.dart tool/setup_deep_links.py; do
            test -f "$file" || { echo "::error::Fichier Flutter absent: $file"; exit 1; }
          done
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --project-name viscera --org com.viscera .
      - name: Générer l’icône APK identique au Web
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg
          python3 tool/apply_viscera_branding.py
      - name: Configurer Firebase Android
        run: python3 tool/configure_firebase_android.py
      - name: Configurer les liens de confirmation
        run: python3 tool/setup_deep_links.py
      - name: Configurer les rappels Android des gardes
        run: python3 tool/configure_duty_reminders_android.py
      - name: Vérifier la confidentialité sur écran verrouillé
        run: python3 tool/test_android_lock_screen.py
      - name: Dépendances
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Construire un APK universel (un seul fichier)
        run: flutter build apk --release --tree-shake-icons --dart-define="ENABLE_FIREBASE_PUSH=true" --dart-define="SUPABASE_URL=https://qkupckqgczdqiwxozxko.supabase.co" --dart-define="SUPABASE_PUBLISHABLE_KEY=sb_publishable_0G2xPDJrxhbl5sjtIYIZBw_6tK30bO8" --dart-define="VISCERA_BUILD_SHA=${{ github.sha }}"
      - name: Vérifier et nommer l'APK unique
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          test -s "$APK_DIR/app-release.apk"
          test "$(find "$APK_DIR" -maxdepth 1 -name '*-release.apk' | wc -l)" -eq 1
          cp "$APK_DIR/app-release.apk" "$APK_DIR/VISCERA.apk"
          test -s "$APK_DIR/VISCERA.apk"
          du -h "$APK_DIR/VISCERA.apk"
      - name: Publier l'APK universel unique
        uses: actions/upload-artifact@v4
        with:
          name: VISCERA-Android-Release-APK
          path: build/app/outputs/flutter-apk/VISCERA.apk
          if-no-files-found: error
          retention-days: 14
