name: Deploy VISCERA Web to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'tool/check_web_build.py'
      - 'pubspec.yaml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'tool/check_web_build.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=web --project-name viscera --org com.viscera .
      - run: flutter pub get
      - run: flutter build web --release --base-href /VISCERA/ --dart-define=SUPABASE_URL=https://qkupckqgczdqiwxozxko.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_0G2xPDJrxhbl5sjtIYIZBw_6tK30bO8 --dart-define=ENABLE_FIREBASE_PUSH=true
      - name: Contrôler le JavaScript de démarrage
        run: node --check build/web/flutter_bootstrap.js
      - name: Contrôler les scripts et le chemin du site
        run: python3 tool/check_web_build.py
      - run: touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
